name: QuantumROM Tools Sixteen.

on:
  workflow_dispatch:
    inputs:
      STOCK_DEVICE:
        description: "STOCK_DEVICE_MODEL (np. SM-A528B)"
        required: true
        default: "SM-A528B"
      STOCK_DEVICE_CSC:
        description: "CSC dla urządzenia bazowego (np. XEO)"
        required: true
        default: "BTU"
      STOCK_DEVICE_IMEI:
        description: "IMEI dla urządzenia bazowego (SM-A528B)"
        required: true
        default: "350019151656457"
      USE_UI_8_TETHERING_APEX:
        description: "Set True if your kernel BPF version is 5.4 (lower than 5.10)."
        required: true
        default: "True"
      TARGET_DEVICE:
        description: "TARGET_DEVICE_MODEL (np. SM-G990B)"
        required: true
        default: "SM-G990B"
      TARGET_DEVICE_CSC:
        description: "TARGET_DEVICE_CSC (np. EUX)"
        required: true
        default: "EUX"
      TARGET_DEVICE_IMEI:
        description: "TARGET_DEVICE_IMEI (dla SM-G990B)"
        required: true
        default: "353718681234563"
      OUTPUT_FILESYSTEM:
        description: "OUTPUT_FILESYSTEM. e.g erofs / ext4 / f2fs"
        required: true
        default: "ext4"
      CRAP_VERSION:
        description: "Wersja CrapUI (np. 1.0, 1.2, Beta)"
        required: true
        default: "1.0"
      COMPRESS_IMG_TO_XZ:
        description: "Compress IMG to XZ (True/False)"
        required: true
        default: "False"

jobs:
  build:
    name: Start QuantumROM Tools Sixteen.
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository.
        uses: actions/checkout@v4

      - name: Validate STOCK_DEVICE
        run: |
          STOCK_DEVICE="${{ github.event.inputs.STOCK_DEVICE }}"
          DEVICE_PATH="QuantumROM/Devices/$STOCK_DEVICE"
          if [ "$STOCK_DEVICE" != "None" ] && [ ! -d "$DEVICE_PATH" ]; then
            echo "❌ $STOCK_DEVICE is not supported with this tool."
            exit 1
          fi

      - name: Remove unnecessary files.
        uses: rokibhasansagar/slimhub_actions@v25.42.5

      - name: Install Dependencies.
        run: |
          sudo apt update
          # 1. Naprawa instalacji Javy (pełny pakiet openjdk-17-jdk dla Ubuntu 24.04)
          sudo apt install -y p7zip-full lz4 liblz4-1 liblz4-dev libzstd1 libzstd-dev build-essential android-sdk-libsparse-utils f2fs-tools fuse2fs fuse e2fsprogs python3 python3-pip zipalign unzip openjdk-17-jdk jq perl xxd kmod erofs-utils linux-modules-extra-$(uname -r) git
          sudo modprobe f2fs
          
          # 2. Instalacja samloadera z działającego repozytorium z flagą omijającą restrykcje środowiska
          pip3 install git+https://github.com/SN-Abdullah-Al-Noman/samloader.git --break-system-packages
          
          # 3. Naprawa błędu 404 (SAR-Tools) - klonowanie i instalacja lokalna bezpośrednio ze źródeł
          git clone https://github.com/Lanchon/SAR-Tools.git
          cd SAR-Tools
          pip3 install . --break-system-packages
          cd ..
          
          mkdir -p FW WORK OUT

      - name: Download TARGET firmware ▶️ ${{ github.event.inputs.TARGET_DEVICE }}
        run: |
          source scripts/QuantumRom.sh
          # Pobieranie softu portu (czysty zestaw argumentów bez pustej zmiennej na końcu)
          DOWNLOAD_FIRMWARE "${{ github.event.inputs.TARGET_DEVICE }}" "${{ github.event.inputs.TARGET_DEVICE_CSC }}" "${{ github.event.inputs.TARGET_DEVICE_IMEI }}" "FW"

      - name: Download STOCK firmware ▶️ ${{ github.event.inputs.STOCK_DEVICE }}
        run: |
          source scripts/QuantumRom.sh
          # Pobieranie softu bazy (wypełnienie pól CSC i IMEI podanych w formularzu Actions)
          DOWNLOAD_FIRMWARE "${{ github.event.inputs.STOCK_DEVICE }}" "${{ github.event.inputs.STOCK_DEVICE_CSC }}" "${{ github.event.inputs.STOCK_DEVICE_IMEI }}" "FW"

      - name: Extract firmware
        run: |
          source scripts/QuantumRom.sh
          # Zabezpieczenie: wypakowanie obu systemów w strukturze FW/ tak, aby skrypty miały do nich pełny dostęp
          EXTRACT_FIRMWARE "FW/${{ github.event.inputs.TARGET_DEVICE }}"
          EXTRACT_FIRMWARE "FW/${{ github.event.inputs.STOCK_DEVICE }}"

      - name: Start Rom Build For ${{ github.event.inputs.STOCK_DEVICE }}
        run: |
          sudo bash sixteen.sh \
            "${{ github.event.inputs.STOCK_DEVICE }}" \
            "${{ github.event.inputs.USE_UI_8_TETHERING_APEX }}" \
            "${{ github.event.inputs.TARGET_DEVICE }}" \
            "${{ github.event.inputs.TARGET_DEVICE_CSC }}" \
            "${{ github.event.inputs.TARGET_DEVICE_IMEI }}" \
            "${{ github.event.inputs.OUTPUT_FILESYSTEM }}" \
            "${{ github.event.inputs.CRAP_VERSION }}"

      - name: Compress all .img & make zip file before upload.
        run: |
          echo "BUILD_TIME=$(TZ='Asia/Dhaka' date '+%Y-%m-%d %I:%M:%S %p UTC+6')" >> $GITHUB_ENV
          OUT_DIR="$(pwd)/OUT"
          ZIP_NAME="${{ github.event.inputs.TARGET_DEVICE }}_Port_For_${{ github.event.inputs.STOCK_DEVICE }}.zip"
          ZIP_PATH="$OUT_DIR/$ZIP_NAME"

          if [ "${{ github.event.inputs.COMPRESS_IMG_TO_XZ }}" = "True" ]; then
            echo "Compressing all .img files to .xz (level 9)..."
            for img in "$OUT_DIR"/*.img; do
              [ -f "$img" ] || continue
              echo "Compressing $img"
              sudo xz -9 -T0 "$img"
            done
            sudo rm -f "$OUT_DIR"/*.img
          fi

          echo "Creating zip: $ZIP_NAME"
          7z a -tzip "$ZIP_PATH" "$OUT_DIR"/* -mx=5
 
          echo "ZIP_PATH=$ZIP_PATH" >> $GITHUB_ENV

      - name: Upload file in GoFile & Create Release.
        env:
          GIT_TOKEN: ${{ secrets.GIT_TOKEN }}
          STOCK_DEVICE: ${{ github.event.inputs.STOCK_DEVICE }}
          TARGET_DEVICE: ${{ github.event.inputs.TARGET_DEVICE }}
          OUTPUT_FILESYSTEM: ${{ github.event.inputs.OUTPUT_FILESYSTEM }}
          COMPRESS_IMG_TO_XZ: ${{ github.event.inputs.COMPRESS_IMG_TO_XZ }}
          USE_UI_8_TETHERING_APEX: ${{ github.event.inputs.USE_UI_8_TETHERING_APEX }}
        run: |
          bash release.sh
