name: QuantumROM Tools Sixteen.

on:
  workflow_dispatch:
    inputs:
      STOCK_DEVICE:
        description: "STOCK_DEVICE_MODEL (np. SM-A528B lub None)"
        required: true
        default: "SM-A528B"
      STOCK_DEVICE_CSC:
        description: "STOCK_DEVICE_CSC (Region dla telefonu bazowego, np. XEO)"
        required: true
        default: "XEO"
      STOCK_DEVICE_IMEI:
        description: "STOCK_DEVICE_IMEI (IMEI dla telefonu bazowego, wymagany przez samloader)"
        required: true
        default: "353718681234563"
      USE_UI_8_TETHERING_APEX:
        description: "Set True if your kernel BPF version is 5.4 (lower than 5.10)."
        required: true
        default: "True"
      TARGET_DEVICE:
        description: "TARGET_DEVICE_MODEL."
        required: true
        default: "SM-G990B"
      TARGET_DEVICE_CSC:
        description: "TARGET_DEVICE_CSC."
        required: true
        default: "EUX"
      TARGET_DEVICE_IMEI:
        description: "TARGET_DEVICE_IMEI."
        required: true
        default: "353718681234563"
      OUTPUT_FILESYSTEM:
        description: "OUTPUT_FILESYSTEM. e.g erofs / ext4 / f2fs"
        required: true
        default: "erofs"
      CRAP_VERSION:
        description: "Wersja CrapUI (np. 1.0, 1.2, Beta)"
        required: true
        default: "1.0"
      COMPRESS_IMG_TO_XZ:
        description: "Compress IMG to XZ (True/False)"
        required: true
        default: "True"

jobs:
  build:
    name: Start QuantumROM Tools Sixteen.
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Environment & Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y aria2 android-sdk-libsparse-utils p7zip-full xz-utils secure-delete openjdk-17-jr-headless python3 python3-pip python3-protobuf
          pip3 install --break-system-packages git+https://github.com/Lanchon/SAR-Tools
          pip3 install --break-system-packages samloader --upgrade

      - name: Run QuantumROM Main Script
        run: |
          sudo chmod +x ./sixteen.sh
          sudo chmod +x ./bin/lp/lpmake
          sudo chmod +x ./bin/lp/lpunpack
          sudo chmod +x ./bin/ext4/make_ext4fs
          sudo chmod +x ./bin/f2fs-tools/mkfs.f2fs
          sudo chmod +x ./bin/f2fs-tools/sload.f2fs
          sudo chmod +x ./bin/erofs-utils/mkfs.erofs
          sudo chmod +x ./bin/erofs-utils/extract.erofs

          sudo ./sixteen.sh \
            "${{ github.event.inputs.STOCK_DEVICE }}" \
            "${{ github.event.inputs.STOCK_DEVICE_CSC }}" \
            "${{ github.event.inputs.STOCK_DEVICE_IMEI }}" \
            "${{ github.event.inputs.USE_UI_8_TETHERING_APEX }}" \
            "${{ github.event.inputs.TARGET_DEVICE }}" \
            "${{ github.event.inputs.TARGET_DEVICE_CSC }}" \
            "${{ github.event.inputs.TARGET_DEVICE_IMEI }}" \
            "${{ github.event.inputs.OUTPUT_FILESYSTEM }}" \
            "${{ github.event.inputs.CRAP_VERSION }}"

      - name: Compress all .img & make zip file before upload.
        run: |
          echo "BUILD_TIME=$(TZ='Asia/Dhaka' date '+%Y-%m-%d %I:%M:%S %p UTC+6')\" >> $GITHUB_ENV
          OUT_DIR=\"$(pwd)/OUT\"
          ZIP_NAME=\"${{ github.event.inputs.TARGET_DEVICE }}_Port_For_${{ github.event.inputs.STOCK_DEVICE }}.zip\"
          ZIP_PATH=\"$OUT_DIR/$ZIP_NAME\"

          if [ \"${{ github.event.inputs.COMPRESS_IMG_TO_XZ }}\" = \"True\" ]; then
            echo \"Compressing all .img files to .xz (level 9)...\"
            for img in \"$OUT_DIR\"/*.img; do
              [ -f \"$img\" ] || continue
              echo \"Compressing $img\"
              sudo xz -9 -T0 \"$img\"
            done
            sudo rm -f \"$OUT_DIR\"/*.img
          fi

          echo \"Creating zip: $ZIP_NAME\"
          7z a -tzip \"$ZIP_PATH\" \"$OUT_DIR\"/* -mx=5
 
          echo \"ZIP_PATH=$ZIP_PATH\" >> $GITHUB_ENV

      - name: Upload file in GoFile & Create Release.
        env:
          GIT_TOKEN: ${{ secrets.GIT_TOKEN }}
          STOCK_DEVICE: ${{ github.event.inputs.STOCK_DEVICE }}
          TARGET_DEVICE: ${{ github.event.inputs.TARGET_DEVICE }}
        run: |
          echo "Uploading file to GoFile..."
          # Twój skrypt uploadujący pliki (bez zmian)
