name: QuantumROM Tools Sixteen.

on:
  workflow_dispatch:
    inputs:
      STOCK_DEVICE:
        description: "STOCK_DEVICE_MODEL or None"
        required: true
        default: "SM-A528B"
      USE_UI_8_TETHERING_APEX:
        description: "Set True if your kernel BPF version is 5.4 (lower than 5.10)."
        required: true
        default: "True"
      TARGET_DEVICE:
        description: "TARGET_DEVICE_MODEL."
        required: true
        default: "SM-G990B"
      AP_URL:
        description: "Bezpośredni link URL do pliku AP / Rom ZIP (może być czysty .tar.md5 lub spakowany .zip z obrazami .img)"
        required: true
        default: ""
      CSC_URL:
        description: "Bezpośredni link URL do pliku CSC / HOME_CSC (Opcjonalnie - zostaw puste, jeśli obrazy są bezpośrednio w ZIP wyżej)"
        required: false
        default: ""
      OUTPUT_FILESYSTEM:
        description: "OUTPUT_FILESYSTEM. e.g erofs / ext4 / f2fs"
        required: true
        default: "ext4"
      CRAP_VERSION:
        description: "Wersja CrapUI (np. 1.0, 1.2, Beta)"
        required: true
        default: "Beta"
      COMPRESS_IMG_TO_XZ:
        description: "Compress IMG to XZ (True/False)"
        required: true
        default: "False"

jobs:
  build:
    name: Start QuantumROM Tools Sixteen.
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository.
        uses: actions/checkout@v4

      - name: Validate STOCK_DEVICE
        run: |
          STOCK_DEVICE="${{ github.event.inputs.STOCK_DEVICE }}"
          DEVICE_PATH="QuantumROM/Devices/$STOCK_DEVICE"
          if [ "$STOCK_DEVICE" != "None" ] && [ ! -d "$DEVICE_PATH" ]; then
            echo "❌ $STOCK_DEVICE is not supported with this tool."
            exit 1
          fi

      - name: Remove unnecessary files.
        uses: rokibhasansagar/slimhub_actions@v25.42.5

      - name: Install Dependencies.
        run: |
          sudo apt install -y p7zip-full lz4 liblz4-1 liblz4-dev libzstd1 libzstd-dev build-essential android-sdk-libsparse-utils f2fs-tools fuse2fs fuse e2fsprogs python3 python3-pip zipalign unzip openjdk-17-jdk jq perl xxd kmod erofs-utils linux-modules-extra-$(uname -r)
          sudo modprobe f2fs
          mkdir -p FW WORK OUT

      - name: Download and Package Custom Firmware (AP + CSC)
        run: |
          TARGET_DIR="FW/${{ github.event.inputs.TARGET_DEVICE }}"
          mkdir -p "$TARGET_DIR"
          TMP_DOWNLOAD_DIR=$(mktemp -d)
          TMP_EXTRACT_DIR=$(mktemp -d)
          
          echo "📥 Pobieranie pliku AP / Rom ZIP..."
          wget --no-check-certificate --trust-server-names "${{ github.event.inputs.AP_URL }}" -P "$TMP_DOWNLOAD_DIR"
          
          # Bezpieczne sprawdzenie: pobieraj CSC tylko, gdy użytkownik faktycznie podał link
          if [ -n "${{ github.event.inputs.CSC_URL }}" ]; then
            echo "📥 Pobieranie pliku CSC..."
            wget --no-check-certificate --trust-server-names "${{ github.event.inputs.CSC_URL }}" -P "$TMP_DOWNLOAD_DIR"
          else
            echo "ℹ️ CSC_URL jest puste. Pomijam pobieranie pliku CSC i pracuję na zawartości z AP_URL."
          fi
          
          echo "📦 Sprawdzanie formatów i rozpakowywanie jeśli to konieczne..."
          cd "$TMP_DOWNLOAD_DIR"
          for file in *; do
            [ -f "$file" ] || continue
            if [[ "$file" == *.zip ]]; then
              echo "  > Wykryto archiwum ZIP ($file), rozpakowywanie wewnętrznych plików softu..."
              unzip -q "$file" -d "$TMP_EXTRACT_DIR"
            else
              echo "  > Wykryto bezpośredni plik ($file), przenoszenie..."
              cp "$file" "$TMP_EXTRACT_DIR/"
            fi
          done
          
          echo "📦 Tworzenie ostatecznej paczki firmware.zip dla skryptów basha..."
          cd "$TMP_EXTRACT_DIR"
          zip -j "$GITHUB_WORKSPACE/$TARGET_DIR/firmware.zip" *
          
          # Czyszczenie katalogów tymczasowych
          rm -rf "$TMP_DOWNLOAD_DIR" "$TMP_EXTRACT_DIR"
          
          echo "VERSION=Custom_Split_URL_Build" >> $GITHUB_ENV

      - name: Extract firmware
        run: |
          source scripts/QuantumRom.sh
          EXTRACT_FIRMWARE "FW/${{ github.event.inputs.TARGET_DEVICE }}"

      - name: Start Rom Build For ${{ github.event.inputs.STOCK_DEVICE }}
        run: |
          # Przekazujemy 'GLB' jako CSC oraz stały ciąg cyfr jako IMEI, aby zachować 
          # 100% zgodności ze strukturą argumentów i operacjami wewnątrz sixteen.sh
          sudo bash sixteen.sh \
            "${{ github.event.inputs.STOCK_DEVICE }}" \
            "${{ github.event.inputs.USE_UI_8_TETHERING_APEX }}" \
            "${{ github.event.inputs.TARGET_DEVICE }}" \
            "GLB" \
            "123456789012345" \
            "${{ github.event.inputs.OUTPUT_FILESYSTEM }}" \
            "${{ github.event.inputs.CRAP_VERSION }}"

      - name: Compress all .img & make zip file before upload.
        run: |
          echo "BUILD_TIME=$(TZ='Asia/Dhaka' date '+%Y-%m-%d %I:%M:%S %p UTC+6')" >> $GITHUB_ENV
          OUT_DIR="$(pwd)/OUT"
          ZIP_NAME="${{ github.event.inputs.TARGET_DEVICE }}_Port_For_${{ github.event.inputs.STOCK_DEVICE }}.zip"
          ZIP_PATH="$OUT_DIR/$ZIP_NAME"

          if [ "${{ github.event.inputs.COMPRESS_IMG_TO_XZ }}" = "True" ]; then
            echo "Compressing all .img files to .xz (level 9)..."
            for img in "$OUT_DIR"/*.img; do
              [ -f "$img" ] || continue
              echo "Compressing $img"
              sudo xz -9 -T0 "$img"
            done
            sudo rm -f "$OUT_DIR"/*.img
          fi

          echo "Creating zip: $ZIP_NAME"
          7z a -tzip "$ZIP_PATH" "$OUT_DIR"/* -mx=5
 
          echo "ZIP_PATH=$ZIP_PATH" >> $GITHUB_ENV

      - name: Upload file in GoFile & Create Release.
        env:
          GIT_TOKEN: ${{ secrets.GIT_TOKEN }}
          STOCK_DEVICE: ${{ github.event.inputs.STOCK_DEVICE }}
          TARGET_DEVICE: ${{ github.event.inputs.TARGET_DEVICE }}
          OUTPUT_FILESYSTEM: ${{ github.event.inputs.OUTPUT_FILESYSTEM }}
          COMPRESS_IMG_TO_XZ: ${{ github.event.inputs.COMPRESS_IMG_TO_XZ }}
          USE_UI_8_TETHERING_APEX: ${{ github.event.inputs.USE_UI_8_TETHERING_APEX }}
        run: |
          bash release.sh
