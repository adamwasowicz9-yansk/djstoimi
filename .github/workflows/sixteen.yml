name: Start QuantumROM Tools Sixteen

on:
  workflow_dispatch: # Pozwala na ręczne uruchomienie z zakładki Actions

env:
  STOCK_DEVICE: "A52s"                         # Zmień na swój model bazowy
  USE_UI_8_TETHERING_APEX: "true"
  TARGET_DEVICE: "a52sxq"                      # Twoje urządzenie docelowe
  TARGET_DEVICE_CSC: "XEO"                     # Region CSC (np. XEO dla Polski)
  TARGET_DEVICE_IMEI: "123456789012345"
  OUTPUT_FILESYSTEM: "erofs"
  CRAP_VERSION: "v1.0"

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Environment & Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            aria2 \
            android-sdk-libsparse-utils \
            p7zip-full \
            xz-utils \
            secure-delete \
            openjdk-17-jre-headless \
            python3 \
            python3-pip \
            python3-protobuf \
            jq

          # Pobieranie SAR-Tools jako archiwum tar.gz (rozwiązuje błąd exit code 128)
          pip3 install --break-system-packages https://github.com/Lanchon/SAR-Tools/archive/refs/heads/master.tar.gz
          
          # Aktualizacja samloadera
          pip3 install --break-system-packages samloader --upgrade

      - name: Run Sixteen Script
        run: |
          chmod +x sixteen.sh
          ./sixteen.sh \
            "${{ env.STOCK_DEVICE }}" \
            "${{ env.USE_UI_8_TETHERING_APEX }}" \
            "${{ env.TARGET_DEVICE }}" \
            "${{ env.TARGET_DEVICE_CSC }}" \
            "${{ env.TARGET_DEVICE_IMEI }}" \
            "${{ env.OUTPUT_FILESYSTEM }}" \
            "${{ env.CRAP_VERSION }}"
